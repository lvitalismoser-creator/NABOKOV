<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartões</title>
<style>@property --ft { syntax: '<length>'; inherits: false; initial-value: 0px; }
@property --fb { syntax: '<length>'; inherits: false; initial-value: 0px; }

:root {
  --W: 340px;
  --H: 214px;
  --paper: #fbf6e5;
  --ink: #2c2721;
  --rule: rgba(104, 140, 178, .36);
  --margin-line: rgba(207, 98, 84, .55);
  --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .38  0 0 0 0 .30  0 0 0 0 .16  0 0 0 .13 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
}

* { box-sizing: border-box; }

html, body { height: 100%; margin: 0; }

body {
  overflow: hidden;
  font-family: var(--serif);
  color: var(--ink);
  background:
    radial-gradient(ellipse at 50% 40%, rgba(255, 250, 235, .35), rgba(60, 45, 25, .18) 100%),
    var(--grain),
    #cdc3ae;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

#board { position: fixed; inset: 0; }

/* ---------- cartão ---------- */

.card {
  position: absolute;
  left: 0; top: 0;
  width: var(--W);
  height: var(--H);
  will-change: transform;
}
.card.entering { animation: enter .28s cubic-bezier(.2, .8, .25, 1) both; }
.card.leaving  { animation: leave .2s ease-in both; pointer-events: none; }

@keyframes enter {
  from { opacity: 0; translate: 0 -10px; scale: .96; }
  to   { opacity: 1; translate: 0 0;     scale: 1; }
}
@keyframes leave {
  to { opacity: 0; translate: 0 6px; scale: .97; }
}

.tilt {
  position: absolute; inset: 0;
  transform: rotate(var(--r, 0deg));
  transition: transform .3s cubic-bezier(.2, .8, .25, 1);
}
.card:focus-within .tilt { transform: rotate(0deg); }
.card.dragging .tilt { transform: rotate(calc(var(--r, 0deg) * 2)) scale(1.03); transition-duration: .15s; }

.paper {
  position: absolute; inset: 0;
  border-radius: 3px;
  background:
    var(--grain),
    linear-gradient(172deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 45%),
    var(--paper);
  box-shadow:
    0 0 0 .5px rgba(80, 60, 30, .18),
    0 1px 1px rgba(70, 50, 20, .20),
    0 8px 14px -8px rgba(70, 50, 20, .45);
  transition: box-shadow .25s;
  overflow: hidden;
  cursor: grab;
}
.card:focus-within .paper {
  box-shadow:
    0 0 0 .5px rgba(80, 60, 30, .2),
    0 2px 2px rgba(70, 50, 20, .18),
    0 16px 26px -12px rgba(70, 50, 20, .55);
}
.card.dragging .paper {
  cursor: grabbing;
  box-shadow:
    0 0 0 .5px rgba(80, 60, 30, .2),
    0 4px 4px rgba(70, 50, 20, .15),
    0 28px 36px -14px rgba(70, 50, 20, .6);
}

/* linha vermelha de ficha */
.paper::before {
  content: ""; position: absolute; left: 0; right: 0; top: 27px; height: 1px;
  background: var(--margin-line);
  pointer-events: none;
}

/* indício de "pegar" o cartão: aparece só no hover */
.grip {
  position: absolute; top: 11px; left: 50%; translate: -50% 0;
  width: 26px; height: 3px; border-radius: 2px;
  background: rgba(90, 70, 40, .28);
  opacity: 0; transition: opacity .2s;
  pointer-events: none;
}
.card:hover .grip, .card.dragging .grip { opacity: 1; }

.close {
  position: absolute; top: 4px; right: 6px;
  width: 22px; height: 22px; padding: 0;
  border: 0; background: none; cursor: pointer;
  font: 400 19px/20px var(--serif);
  color: rgba(90, 70, 40, .5);
  opacity: 0; transition: opacity .2s, color .15s;
}
.card:hover .close { opacity: 1; }
.close:hover { color: #b5483a; }

/* ---------- texto ---------- */

.scroll {
  position: absolute; left: 0; right: 0; top: 36px; height: 168px;
  padding: 0 22px;
  overflow-y: auto;
  scrollbar-width: none;
  cursor: text;
  user-select: text;
  background: repeating-linear-gradient(to bottom, transparent 0 26.4px, var(--rule) 27.2px 27.6px, transparent 28px);
  background-attachment: local;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 var(--ft), #000 calc(100% - var(--fb)), transparent 100%);
          mask-image: linear-gradient(to bottom, transparent 0, #000 var(--ft), #000 calc(100% - var(--fb)), transparent 100%);
  transition: --ft .2s, --fb .2s;
}
.scroll::-webkit-scrollbar { display: none; }
.card.more-above .scroll { --ft: 16px; }
.card.more-below .scroll { --fb: 34px; }

.ProseMirror {
  outline: none;
  font-size: 17px;
  line-height: 28px;
  padding-top: 1px;
  caret-color: #b5483a;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  hyphens: none;
}
.ProseMirror p { margin: 0; min-height: 28px; }
.ProseMirror strong { font-weight: 700; }
.ProseMirror em { font-style: italic; }
.ProseMirror ::selection, .ProseMirror::selection { background: rgba(207, 98, 84, .25); }

/* ---------- pilha: o cartão tem mais texto do que mostra ---------- */

.under {
  position: absolute; inset: 0;
  border-radius: 3px;
  background: var(--grain), #f3ecd7;
  box-shadow: 0 0 0 .5px rgba(80, 60, 30, .18), 0 1px 1px rgba(70, 50, 20, .2);
  opacity: 0;
  transform: translate(0, 0) rotate(0);
  transition: transform .45s cubic-bezier(.2, .9, .25, 1.15), opacity .25s;
  pointer-events: none;
}
.u2 { background: var(--grain), #eee5cd; }
.u3 { background: var(--grain), #e9dfc4; }

.card[data-depth="1"] .u1,
.card[data-depth="2"] .u1,
.card[data-depth="3"] .u1 { opacity: 1; transform: translate(3px, 4px) rotate(.5deg); }
.card[data-depth="2"] .u2,
.card[data-depth="3"] .u2 { opacity: 1; transform: translate(6px, 8px) rotate(-.45deg); }
.card[data-depth="3"] .u3 { opacity: 1; transform: translate(9px, 12px) rotate(.7deg); }

/* ---------- interface mínima ---------- */

#hint {
  position: fixed; left: 22px; bottom: 16px;
  font: italic 13px/1 var(--serif);
  color: rgba(60, 45, 25, .5);
  letter-spacing: .01em;
  transition: opacity .4s;
  pointer-events: none;
}
body.editing #hint { opacity: 0; }

#empty {
  position: fixed; left: 50%; top: 50%;
  width: var(--W); height: var(--H);
  translate: -50% -50%;
  border: 1.5px dashed rgba(60, 45, 25, .28);
  border-radius: 4px;
  display: none; align-items: center; justify-content: center;
  font: italic 16px var(--serif);
  color: rgba(60, 45, 25, .5);
  pointer-events: none;
}
body.is-empty #empty { display: flex; }

#toast {
  position: fixed; left: 50%; bottom: 26px;
  translate: -50% 20px;
  opacity: 0; pointer-events: none;
  padding: 9px 16px;
  background: var(--grain), var(--paper);
  border-radius: 3px;
  box-shadow: 0 0 0 .5px rgba(80, 60, 30, .2), 0 8px 18px -8px rgba(70, 50, 20, .5);
  font: 15px/1 var(--serif);
  transition: opacity .25s, translate .25s;
  user-select: none;
}
#toast.show { opacity: 1; translate: -50% 0; pointer-events: auto; }
#toast button {
  margin-left: 12px; padding: 0; border: 0; background: none;
  font: italic 15px var(--serif); color: #b5483a; cursor: pointer;
  text-decoration: underline; text-underline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {
  .card.entering, .card.leaving { animation-duration: .01s; }
  .tilt, .under { transition: none; }
}

/* ---------- categorias (acima da linha vermelha) ---------- */

.cats {
  position: absolute; top: 5px; left: 12px; z-index: 2;
  display: flex; gap: 10px; height: 20px; align-items: center;
}
.cats button {
  --cc: #6b5a3a;
  padding: 0; border: 0; background: none; cursor: pointer;
  font: italic 12px/20px var(--serif); letter-spacing: .02em;
  color: rgba(90, 70, 40, .6);
  opacity: 0; pointer-events: none;
  transition: opacity .2s, color .15s;
}
.cats button[data-cat="cena"]  { --cc: #b5483a; }
.cats button[data-cat="nota"]  { --cc: #3f6f9a; }
.cats button[data-cat="lugar"] { --cc: #4d7a4f; }
.card:hover .cats button { opacity: .85; pointer-events: auto; }
.cats button:hover { color: var(--cc); opacity: 1; }
.cats button.on {
  opacity: 1; pointer-events: auto; color: var(--cc); font-weight: 600;
  text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px;
}

/* ---------- guardar (azul, com bandeja; nunca parecido com excluir) ---------- */

.stash {
  position: absolute; top: 4px; right: 36px;
  height: 22px; padding: 0 2px;
  display: flex; align-items: center; gap: 4px;
  border: 0; background: none; cursor: pointer;
  font: italic 12px/22px var(--serif);
  color: rgba(63, 111, 154, .85);
  opacity: 0; transition: opacity .2s, color .15s;
}
.card:hover .stash { opacity: 1; }
.stash:hover { color: #2a5a85; text-decoration: underline; text-underline-offset: 3px; }
.card.in-group .stash { display: none; }
.card.stashing { animation: leave .18s ease-in both; pointer-events: none; }
.card.stashed { display: none; }

/* ---------- grupos temporários ---------- */

.gframe {
  position: absolute; left: 0; top: 0;
  border: 1.5px dashed rgba(63, 111, 154, .45);
  border-radius: 10px;
  background: rgba(255, 250, 235, .16);
  pointer-events: none;
}
.gframe.join { animation: join .5s ease-out; }
@keyframes join {
  from { box-shadow: 0 0 0 6px rgba(63, 111, 154, .35); }
  to   { box-shadow: 0 0 0 0 rgba(63, 111, 154, 0); }
}
.gtab {
  position: absolute; left: 10px; top: 5px;
  display: flex; align-items: center; gap: 14px;
  font: italic 12.5px/20px var(--serif);
  color: rgba(40, 70, 100, .75);
  pointer-events: auto;
}
.gn { cursor: grab; padding-right: 2px; }
.gtab button {
  display: flex; align-items: center; gap: 4px;
  padding: 0; border: 0; background: none; cursor: pointer;
  font: inherit; color: inherit; opacity: .75; transition: opacity .15s;
}
.gtab button:hover { opacity: 1; text-decoration: underline; text-underline-offset: 3px; }

/* ímã: alvo aceso e cartão que vai grudar */
.card.magnet .paper, .card.snapped .paper {
  box-shadow:
    0 0 0 2px rgba(63, 111, 154, .6),
    0 4px 4px rgba(70, 50, 20, .15),
    0 22px 30px -14px rgba(70, 50, 20, .55);
}
.card.snapped { transition: transform .1s ease-out; }

/* ---------- gaveta: cartões guardados, minimizados ---------- */

#dock {
  position: fixed; right: 18px; bottom: 14px;
  max-width: max(240px, calc(100vw - 560px));
  display: none; align-items: flex-end; gap: 12px;
  padding: 8px 8px 6px; overflow-x: auto; scrollbar-width: thin;
}
body.has-stash #dock { display: flex; }
body.showing #dock, body.showing #corner { visibility: hidden; }
.dock-label {
  flex: none; align-self: center;
  font: italic 12.5px var(--serif); color: rgba(60, 45, 25, .55);
}

.chip {
  position: relative; flex: none;
  width: 116px; height: 66px;
  padding: 17px 8px 5px;
  background: var(--grain), var(--paper);
  border-radius: 2px;
  box-shadow: 0 0 0 .5px rgba(80, 60, 30, .2), 0 1px 1px rgba(70, 50, 20, .2), 0 5px 9px -6px rgba(70, 50, 20, .5);
  cursor: pointer; user-select: none;
  color: var(--ink);
  transition: transform .2s, box-shadow .2s;
}
.chip::before {
  content: ""; position: absolute; left: 0; right: 0; top: 13px; height: 1px;
  background: var(--margin-line);
}
.chip:hover { transform: translateY(-3px); }
.chip.stack {
  box-shadow:
    0 0 0 .5px rgba(80, 60, 30, .2),
    3px 3px 0 0 #f3ecd7, 3px 3px 0 .5px rgba(80, 60, 30, .2),
    6px 6px 0 0 #eae0c6, 6px 6px 0 .5px rgba(80, 60, 30, .2);
}
.ctext {
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden;
  font-size: 8.5px; line-height: 10px;
}
.ccat {
  position: absolute; top: 2px; left: 8px;
  font: italic 600 8.5px/10px var(--serif);
}
.chip.c-cena  .ccat { color: #b5483a; }
.chip.c-nota  .ccat { color: #3f6f9a; }
.chip.c-lugar .ccat { color: #4d7a4f; }
.cn, .cnum {
  position: absolute; right: 6px; font: 600 9px/10px var(--serif); color: rgba(60, 45, 25, .6);
}
.cn { bottom: 3px; }
.cnum { top: 2px; }

/* ---------- organizar (botão na mesa) ---------- */

#corner {
  position: fixed; top: 14px; right: 18px; z-index: 40;
  display: flex; align-items: center; gap: 8px;
}
#organize {
  display: flex; align-items: center; gap: 7px;
  padding: 7px 13px 7px 11px;
  border: 0; border-radius: 3px; cursor: pointer;
  background: var(--grain), var(--paper);
  box-shadow: 0 0 0 .5px rgba(80, 60, 30, .25), 0 4px 10px -6px rgba(70, 50, 20, .5);
  font: italic 14px/1 var(--serif); color: rgba(60, 45, 25, .8);
  transition: transform .15s, color .15s;
}
#organize:hover { transform: translateY(-1px); color: #b5483a; }
body.is-empty #organize { opacity: .4; }

/* ---------- organizador ---------- */

#show[hidden] { display: none; }
#show {
  position: fixed; inset: 0; z-index: 50;
  display: flex; flex-direction: column;
  background: rgba(38, 30, 19, .92);
  backdrop-filter: blur(5px);
  color: #f3ecd7;
}
.show-top {
  display: flex; align-items: center; gap: 20px; padding: 14px 24px;
  font: italic 15px var(--serif);
}
#show-count { font-style: normal; letter-spacing: .06em; opacity: .7; font-size: 14px; }
.show-sp { flex: 1; }
.show-top button {
  padding: 4px 0; border: 0; background: none; cursor: pointer;
  font: italic 15px var(--serif); color: #f3ecd7; opacity: .75;
  text-decoration: underline; text-decoration-color: rgba(243, 236, 215, .35); text-underline-offset: 4px;
  transition: opacity .15s;
}
.show-top button:hover { opacity: 1; text-decoration-color: currentColor; }
.show-top .back { text-decoration: none; opacity: .85; font-style: normal; }
.org-label { opacity: .5; font-size: 13px; margin-right: -12px; }
#org-name {
  font-style: normal; font-size: 16px; opacity: 1; text-decoration: none; white-space: pre;
  padding: 4px 10px; border-radius: 3px; background: rgba(251, 246, 229, .08);
}
#org-name:hover { background: rgba(251, 246, 229, .16); }
#org-name.unnamed { font-style: italic; opacity: .8; }
#org-name-input {
  width: 300px; padding: 4px 10px; border: 0; border-radius: 3px; outline: 2px solid rgba(243, 236, 215, .5);
  background: var(--paper); color: var(--ink); font: 16px var(--serif); user-select: text;
}
.show-top button.primary {
  padding: 6px 13px; border-radius: 3px; text-decoration: none; opacity: 1; font-style: normal;
  background: var(--grain), var(--paper); color: var(--ink);
}
.show-top button.primary:hover { color: #b5483a; }
#org-notes.has-note::after { content: " •"; color: #9cc0e0; }
.notes-open #org-notes { opacity: 1; text-decoration-color: currentColor; }

/* lista de ordens */
#orders-pop {
  position: fixed; z-index: 70; min-width: 380px; max-height: 60vh; overflow-y: auto;
  padding: 8px 0; border-radius: 4px;
  background: var(--grain), var(--paper); color: var(--ink);
  box-shadow: 0 0 0 .5px rgba(80, 60, 30, .3), 0 18px 40px -12px rgba(0, 0, 0, .6);
}
#orders-pop[hidden] { display: none; }
#orders-pop button { border: 0; background: none; cursor: pointer; font-family: var(--serif); color: inherit; }
#orders-pop .pop-act {
  display: block; width: 100%; padding: 8px 16px 10px; text-align: left;
  font: italic 14px var(--serif); color: #3f6f9a;
  border-bottom: 1px solid rgba(80, 60, 30, .15);
}
#orders-pop .pop-act:hover { background: rgba(63, 111, 154, .08); }
.pop-row { display: flex; align-items: center; gap: 10px; padding: 0 14px 0 6px; }
.pop-row:hover { background: rgba(80, 60, 30, .06); }
.pop-row.on { box-shadow: inset 3px 0 0 #b5483a; }
.pop-open { flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 8px 10px; text-align: left; }
.pop-name { font-size: 15px; }
.unnamed .pop-name { font-style: italic; }
.pop-meta { font-size: 12px; opacity: .55; }
#orders-pop .pop-mini { font: italic 12.5px var(--serif); opacity: .55; padding: 4px 2px; }
#orders-pop .pop-mini:hover { opacity: 1; text-decoration: underline; text-underline-offset: 3px; }

/* meio: leitura */
.show-mid { flex: 1; min-height: 0; display: flex; align-items: center; gap: 8px; padding: 0 14px; }
#stage { flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.stage-empty { max-width: 420px; text-align: center; font: italic 17px/1.5 var(--serif); opacity: .7; }
.nav {
  flex: none; width: 52px; height: 52px; border-radius: 50%;
  border: 0; cursor: pointer; background: rgba(251, 246, 229, .12); color: #f3ecd7;
  font: 34px/46px var(--serif); padding: 0 0 4px;
  transition: background .15s, opacity .15s;
}
.nav:hover { background: rgba(251, 246, 229, .25); }
.at-start #prev, .at-end #next { opacity: .25; pointer-events: none; }

.slide { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 100%; }
.slide.in-r { animation: sin-r .3s cubic-bezier(.2, .8, .25, 1) both; }
.slide.in-l { animation: sin-l .3s cubic-bezier(.2, .8, .25, 1) both; }
@keyframes sin-r { from { opacity: 0; transform: translateX(40px); } }
@keyframes sin-l { from { opacity: 0; transform: translateX(-40px); } }
.slide-cap { font: italic 14px var(--serif); opacity: .65; }
.slide-row { display: flex; gap: 22px; align-items: flex-start; justify-content: center; flex-wrap: wrap; max-width: 100%; }
.slide.aside .slide-row { opacity: .45; transform: translateY(-8px); }
.slide-acts { display: flex; gap: 26px; font: italic 14px var(--serif); }
.slide-acts button {
  padding: 2px 0; border: 0; background: none; cursor: pointer;
  font: inherit; color: #f3ecd7; opacity: .6; white-space: pre;
  text-decoration: underline; text-decoration-color: rgba(243, 236, 215, .3); text-underline-offset: 4px;
}
.slide-acts button:hover { opacity: 1; text-decoration-color: currentColor; }

.s-card {
  position: relative;
  width: min(calc((min(1180px, 100vw - 150px) - 44px) / var(--n, 1)), 600px);
  min-height: 190px; max-height: calc(100vh - 340px);
  padding: 44px 0 14px;
  background: var(--grain), linear-gradient(172deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 45%), var(--paper);
  color: var(--ink); border-radius: 3px;
  box-shadow: 0 20px 40px -14px rgba(0, 0, 0, .6);
  display: flex; flex-direction: column; overflow: hidden;
}
.notes-open .s-card { width: min(calc((min(1180px, 100vw - 460px) - 44px) / var(--n, 1)), 560px); }
.s-card::before {
  content: ""; position: absolute; left: 0; right: 0; top: 34px; height: 1px; background: var(--margin-line);
}
.s-cat { position: absolute; top: 8px; left: 20px; font: italic 600 14px/22px var(--serif); }
.c-cena .s-cat { color: #b5483a; }
.c-nota .s-cat { color: #3f6f9a; }
.c-lugar .s-cat { color: #4d7a4f; }
.s-body {
  overflow-y: auto; padding: 4px 28px 14px; user-select: text; cursor: text;
  font-size: 20px; line-height: 32px; scrollbar-width: thin;
  background: repeating-linear-gradient(to bottom, transparent 0 30.4px, var(--rule) 31.2px 31.6px, transparent 32px);
  background-attachment: local;
}
.s-body p { margin: 0; min-height: 32px; }
.s-body strong { font-weight: 700; }
.s-body em { font-style: italic; }
.slide.multi .s-body {
  font-size: 17px; line-height: 28px;
  background: repeating-linear-gradient(to bottom, transparent 0 26.4px, var(--rule) 27.2px 27.6px, transparent 28px);
  background-attachment: local;
}
.slide.multi .s-body p { min-height: 28px; }

/* notas */
#notes { display: none; flex: none; width: 290px; align-self: stretch; flex-direction: column; justify-content: center; gap: 22px; padding: 14px 6px 18px 10px; }
.notes-open #notes { display: flex; }
#notes label { display: flex; flex-direction: column; gap: 6px; font: italic 13px var(--serif); color: rgba(243, 236, 215, .7); }
#notes textarea {
  height: min(170px, 22vh); resize: none; border: 0; border-radius: 3px; padding: 10px 12px;
  background: var(--grain), var(--paper); color: var(--ink);
  font: 15px/1.5 var(--serif); user-select: text; outline: none;
}
#notes textarea:focus { box-shadow: 0 0 0 2px rgba(243, 236, 215, .5); }
#notes textarea::placeholder { color: rgba(60, 45, 25, .35); font-style: italic; }
#notes textarea:disabled { opacity: .4; }

/* baixo: fileira da ordem + bandeja */
.show-bottom { display: flex; align-items: flex-end; gap: 18px; padding: 0 24px 6px; }
#strip {
  flex: 1; min-width: 0;
  display: flex; gap: 14px; align-items: flex-end;
  padding: 30px 4px 14px; overflow-x: auto; scrollbar-width: thin;
}
#strip .chip { opacity: .6; touch-action: none; cursor: grab; }
#strip .chip:hover { opacity: .95; }
#strip .chip.on { opacity: 1; transform: translateY(-5px); outline: 2px solid #f3ecd7; outline-offset: 2px; }
#strip .chip.aside { opacity: .28; translate: 0 -16px; }
#strip .chip.aside:hover { opacity: .6; }
#strip .chip.aside.on { opacity: .75; }
#strip .chip.lifted, #tray-chips .chip.lifted { opacity: .12; }
.chip.has-note::after {
  content: ""; position: absolute; left: 7px; bottom: 5px; width: 5px; height: 5px; border-radius: 50%; background: #3f6f9a;
}
.chip.ghost {
  position: fixed; left: 0; top: 0; z-index: 80; pointer-events: none; opacity: .95; cursor: grabbing;
  box-shadow: 0 0 0 .5px rgba(80, 60, 30, .3), 0 14px 24px -8px rgba(0, 0, 0, .6);
}

#tray {
  flex: none; max-width: 38%;
  display: flex; flex-direction: column; gap: 8px;
  margin-bottom: 14px; padding: 10px 12px 12px;
  border: 1.5px dashed rgba(243, 236, 215, .25); border-radius: 6px;
  transition: border-color .15s, background .15s;
}
#tray[hidden] { display: none; }
#tray.drop-here { border-color: rgba(243, 236, 215, .7); background: rgba(251, 246, 229, .06); }
.tray-label { font: italic 13px var(--serif); opacity: .6; }
#tray-chips { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: thin; padding-top: 4px; }
#tray-chips .chip { opacity: .85; touch-action: none; cursor: grab; }
#tray-chips .chip:hover { opacity: 1; }

#drop-mark {
  position: fixed; left: 0; top: 0; z-index: 75; width: 3px; border-radius: 2px;
  background: #f3ecd7; box-shadow: 0 0 10px rgba(243, 236, 215, .6);
  display: none; pointer-events: none;
}
#drop-mark.on { display: block; }

.org-keys {
  padding: 0 24px 10px; font: italic 12px var(--serif); color: rgba(243, 236, 215, .38);
}

#toast { z-index: 60; }

/* ---------- pontinho de salvo ---------- */
/* cinza = salvo; pulsa uma vez ao gravar; vermelho = falhou. O texto aparece só no hover. */
#save-dot {
  position: relative; width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
}
#save-dot i {
  width: 7px; height: 7px; border-radius: 50%;
  background: rgba(60, 45, 25, .32);
  transition: background .3s;
}
#save-dot.pulse i { animation: dot-pulse .9s ease-out; }
@keyframes dot-pulse {
  0% { transform: scale(1); background: rgba(60, 45, 25, .32); }
  30% { transform: scale(1.7); background: rgba(63, 111, 154, .8); }
  100% { transform: scale(1); background: rgba(60, 45, 25, .32); }
}
#save-dot[data-state="failed"] i { background: #c0392b; box-shadow: 0 0 0 3px rgba(192, 57, 43, .22); animation: none; }
#save-dot[data-state="ro"] i { background: none; box-shadow: inset 0 0 0 1.5px rgba(60, 45, 25, .4); }
#save-dot::after {
  content: attr(data-tip);
  position: absolute; right: -4px; top: 26px;
  padding: 6px 10px; border-radius: 3px; white-space: nowrap;
  background: var(--grain), var(--paper);
  box-shadow: 0 0 0 .5px rgba(80, 60, 30, .25), 0 6px 14px -8px rgba(70, 50, 20, .6);
  font: italic 13px/1 var(--serif); color: rgba(60, 45, 25, .85);
  opacity: 0; pointer-events: none; transition: opacity .15s;
}
#save-dot:hover::after { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #save-dot.pulse i { animation: none; } }

/* ---------- menu ≡ ---------- */
#menu-btn {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 28px; padding: 0;
  border: 0; border-radius: 3px; cursor: pointer;
  background: var(--grain), var(--paper);
  box-shadow: 0 0 0 .5px rgba(80, 60, 30, .25), 0 4px 10px -6px rgba(70, 50, 20, .5);
  color: rgba(60, 45, 25, .8);
  transition: transform .15s, color .15s;
}
#menu-btn:hover, #menu-btn[aria-expanded="true"] { color: #b5483a; }
#menu-btn:hover { transform: translateY(-1px); }
#menu[hidden], #sheet[hidden] { display: none; }
#menu {
  position: fixed; top: 50px; right: 18px; z-index: 45; min-width: 290px;
  padding: 6px 0; border-radius: 4px;
  background: var(--grain), var(--paper); color: var(--ink);
  box-shadow: 0 0 0 .5px rgba(80, 60, 30, .3), 0 18px 40px -14px rgba(60, 40, 15, .7);
}
#menu button {
  display: flex; align-items: baseline; justify-content: space-between; gap: 28px;
  width: 100%; padding: 8px 16px; border: 0; background: none; cursor: pointer;
  font: 15px/1.2 var(--serif); color: inherit; text-align: left;
}
#menu button:hover, #menu button:focus-visible { background: rgba(80, 60, 30, .08); outline: none; }
#menu kbd { font: italic 12.5px var(--serif); opacity: .5; white-space: nowrap; }
#menu hr { border: 0; border-top: 1px solid rgba(80, 60, 30, .14); margin: 5px 0; }

/* ---------- janelas do menu (lixeira, instantâneos, atalhos, exportar) ---------- */
#sheet {
  position: fixed; inset: 0; z-index: 55;
  display: flex; align-items: center; justify-content: center;
  background: rgba(40, 30, 15, .34);
  user-select: none;
}
.sheet-box {
  display: flex; flex-direction: column;
  width: min(560px, calc(100vw - 48px)); max-height: calc(100vh - 80px);
  border-radius: 5px; outline: none;
  background: var(--grain), var(--paper); color: var(--ink);
  box-shadow: 0 0 0 .5px rgba(80, 60, 30, .3), 0 30px 70px -20px rgba(30, 20, 5, .8);
}
#sheet.wide .sheet-box { width: min(860px, calc(100vw - 48px)); }
.sheet-box header {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 16px 22px 12px; border-bottom: 1px solid var(--margin-line);
}
.sheet-box h2 { margin: 0; font: italic 19px/1.2 var(--serif); font-weight: normal; }
.sheet-box button {
  border: 0; background: none; padding: 0; cursor: pointer;
  font: italic 14px var(--serif); color: rgba(60, 45, 25, .7);
  text-decoration: underline; text-decoration-color: rgba(60, 45, 25, .3); text-underline-offset: 3px;
}
.sheet-box button:hover { color: #b5483a; }
#sheet-body { padding: 14px 22px 20px; overflow-y: auto; font-size: 15px; line-height: 1.45; }
.sheet-lead { margin: 0 0 12px; font-style: italic; font-size: 14px; color: rgba(60, 45, 25, .7); }
.sheet-empty { margin: 18px 0 8px; font-style: italic; color: rgba(60, 45, 25, .6); }
.sheet-row {
  display: flex; align-items: center; gap: 14px;
  padding: 9px 0; border-top: 1px solid var(--rule);
}
.sheet-row:first-of-type { border-top: 0; }
.sheet-row .r-main { flex: 1; min-width: 0; }
.sheet-row .r-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-row .r-meta { font-size: 12.5px; opacity: .58; }
.sheet-row .r-cat { font: 10.5px/1 var(--serif); letter-spacing: .1em; text-transform: uppercase; opacity: .6; margin-right: 8px; }
.sheet-row.confirm { background: rgba(181, 72, 58, .07); margin: 0 -10px; padding: 9px 10px; border-radius: 3px; }
.sheet-row button.strong { color: #b5483a; text-decoration-color: currentColor; }
.keys-grid { display: grid; grid-template-columns: 215px 1fr; gap: 6px 22px; margin: 0 0 6px; }
.keys-grid dt { font-style: italic; white-space: nowrap; color: rgba(60, 45, 25, .75); }
.keys-grid dd { margin: 0; }
.keys-h { margin: 16px 0 8px; font: 11px/1 var(--serif); letter-spacing: .12em; text-transform: uppercase; opacity: .6; }
.keys-h:first-child { margin-top: 2px; }
</style>
</head>
<body>
<div id="board"></div>
<div id="empty">duplo clique para começar</div>
<div id="hint">duplo clique · novo cartão &nbsp;·&nbsp; N &nbsp;·&nbsp; encoste um cartão na borda de outro para agrupar &nbsp;·&nbsp; Shift + arrastar solta do grupo</div>
<div id="corner">
<span id="save-dot" role="status" tabindex="-1" data-state="saved" data-tip="" aria-label=""><i></i></span>
<button id="organize" title="Organizar: testar ordens de leitura, pôr cartões de lado, anotar e salvar ordens (E)">
  <svg viewBox="0 0 20 16" width="16" height="13" aria-hidden="true"><path d="M1 3.5h3.2c3.6 0 4.6 9 8.6 9H18M1 12.5h3.2c1.6 0 2.6-1.7 3.4-3.4M12.8 3.5H18M15.5 1l2.7 2.5-2.7 2.5M15.5 10l2.7 2.5-2.7 2.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  organizar
</button>
<button id="menu-btn" aria-label="Menu" aria-haspopup="menu" aria-expanded="false" title="Menu: backup, lixeira, instantâneos, atalhos">
  <svg viewBox="0 0 16 14" width="15" height="13" aria-hidden="true"><path d="M1.5 2h13M1.5 7h13M1.5 12h13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
</button>
</div>
<div id="menu" role="menu" hidden></div>
<div id="sheet" hidden>
  <div class="sheet-box" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
    <header><h2 id="sheet-title"></h2><button id="sheet-close" title="Fechar (Esc)">fechar</button></header>
    <div id="sheet-body"></div>
  </div>
</div>
<div id="dock"></div>
<div id="toast"></div>
<div id="show" hidden>
  <div class="show-top">
    <button id="show-close" class="back" title="Voltar à mesa; nada na mesa muda (Esc)">← mesa</button>
    <span class="org-label">ordem</span>
    <button id="org-name" title="Trocar de ordem, renomear, duplicar, excluir"></button>
    <span id="show-count"></span>
    <span class="show-sp"></span>
    <button id="show-again" title="Sortear outra ordem para as peças (R)">embaralhar</button>
    <button id="org-layout" title="Arrumar os cartões na mesa, em fileiras, nesta ordem (pode desfazer)">dispor na mesa</button>
    <button id="org-notes" title="Notas desta ordem e deste ponto dela (C)">notas</button>
    <button id="org-save" class="primary"></button>
  </div>
  <div id="orders-pop" hidden></div>
  <div class="show-mid">
    <button class="nav" id="prev" aria-label="Anterior" title="Anterior (←)">‹</button>
    <div id="stage"></div>
    <button class="nav" id="next" aria-label="Próximo" title="Próximo (→)">›</button>
    <aside id="notes">
      <label>neste ponto da ordem<textarea id="note-piece" spellcheck="false" placeholder="ex.: funciona melhor depois da cena do jardim"></textarea></label>
      <label>sobre esta ordem<textarea id="note-order" spellcheck="false" placeholder="ex.: versão com o flashback no começo"></textarea></label>
    </aside>
  </div>
  <div class="show-bottom">
    <div id="strip" title=""></div>
    <div id="tray" hidden>
      <span class="tray-label">fora da ordem</span>
      <div id="tray-chips"></div>
    </div>
  </div>
  <div class="org-keys">← → ler &nbsp;·&nbsp; arraste as fichas ou Alt + ← → para mover &nbsp;·&nbsp; ↑ pôr de lado &nbsp;·&nbsp; ↓ devolver &nbsp;·&nbsp; Ctrl+Z desfazer</div>
  <div id="drop-mark"></div>
</div>
